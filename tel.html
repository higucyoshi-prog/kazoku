<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>お電話先</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:#f5f6f7; color:#222; font-size:17px; line-height:1.5; }
  header { background:#fff; border-bottom:1px solid #e3e3e3; padding:14px 16px; font-weight:700; font-size:18px; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  p.lead { margin:4px 0 16px; color:#555; }
  a.tel { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #ddd; border-radius:14px;
          padding:16px; margin-bottom:12px; text-decoration:none; color:inherit; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  a.tel:active { background:#eef9f1; }
  a.tel.main { border:2px solid #06c755; }
  .icon { flex:none; width:48px; height:48px; border-radius:50%; background:#06c755; display:flex; align-items:center; justify-content:center; }
  .icon svg { width:26px; height:26px; fill:#fff; }
  .name { font-weight:700; font-size:18px; }
  .sub { font-size:13px; color:#666; }
  .num { font-size:20px; font-weight:700; color:#06a14a; letter-spacing:.03em; }
  .note { font-size:14px; color:#666; margin-top:20px; }
</style>
</head>
<body>

</html>
